<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy Reviews Admin</title><link rel="stylesheet" href="styles.css"><style>.admin-wrap{max-width:850px;margin:40px auto;padding:22px}.admin-wrap input{padding:12px;border:1px solid #cbb98f;border-radius:8px;width:100%;margin:8px 0}.admin-review{display:flex;gap:15px;justify-content:space-between;align-items:center;background:#fff;border:1px solid #dfd3b8;padding:14px;border-radius:10px;margin:10px 0}.admin-review p{margin:5px 0}.admin-review button{background:#8d2929;color:#fff;border:0;border-radius:7px;padding:9px 13px}.muted{color:#756d60}</style></head><body><main class="admin-wrap"><h1>Student Reviews Admin</h1><p class="muted">Sign in using the ADMIN_TOKEN configured as a Cloudflare Worker secret. The token is held only in this page's memory and is not saved.</p><label>Worker URL<input id="worker" placeholder="https://your-reviews-worker.workers.dev"></label><label>Admin Token<input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"></label><button class="green-button" id="load">Sign in &amp; Load Reviews</button><p id="status" role="status"></p><section id="list"></section></main><script>
const $=id=>document.getElementById(id);let token='';let base='';
$('load').onclick=async()=>{base=$('worker').value.trim().replace(/\/$/,'');token=$('token').value; if(!base||!token){$('status').textContent='Enter the Worker URL and admin token.';return;}await load();};
async function load(){try{const r=await fetch(base+'/reviews');if(!r.ok)throw Error('Could not retrieve reviews');const j=await r.json();$('list').replaceChildren();(j.reviews||[]).forEach(v=>{const card=document.createElement('article');card.className='admin-review';const content=document.createElement('div');const title=document.createElement('strong');title.textContent=v.first_name+' — '+v.course;const p=document.createElement('p');p.textContent=v.review;const date=document.createElement('small');date.textContent=v.created_at;content.append(title,p,date);const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this review?'))return;const d=await fetch(base+'/admin/reviews/'+v.id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});if(!d.ok){$('status').textContent='Delete failed. Check your admin token.';return;}await load();};card.append(content,del);$('list').append(card);});$('status').textContent='Loaded '+(j.reviews||[]).length+' reviews.';}catch(e){$('status').textContent=e.message;}}
</script></body></html>
