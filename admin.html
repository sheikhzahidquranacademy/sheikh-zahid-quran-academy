<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy Reviews Admin</title><link rel="stylesheet" href="styles.css"><style>.admin-wrap{max-width:900px;margin:35px auto;padding:22px}.admin-wrap input,.admin-wrap select{padding:12px;border:1px solid #cbb98f;border-radius:8px;width:100%;margin:8px 0}.admin-review{display:flex;gap:15px;justify-content:space-between;align-items:center;background:#fff;border:1px solid #dfd3b8;padding:14px;border-radius:10px;margin:10px 0}.admin-review p{margin:5px 0}.admin-review button{border:0;border-radius:7px;padding:9px 13px;margin:3px;cursor:pointer}.admin-review .danger{background:#8d2929;color:#fff}.admin-review .approve{background:#176b45;color:#fff}.admin-review .pending{background:#eee3c9;color:#46391e}.muted{color:#756d60}.admin-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.admin-actions button{padding:10px 14px}</style></head><body><main class="admin-wrap"><h1>Student Reviews Admin</h1><p class="muted">Sign in with the private ADMIN_TOKEN configured in your Google Apps Script project. The token stays in this page's memory and is not saved.</p><label>Google Apps Script Web App URL<input id="endpoint" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Admin Token<input id="token" type="password" autocomplete="current-password" placeholder="Your private admin token"></label><button class="green-button" id="login">Sign in &amp; Load Reviews</button><p id="status" role="status"></p><section id="controls" hidden><h2>Publishing mode</h2><div class="admin-actions"><select id="mode"><option value="approval">Admin approval (recommended)</option><option value="automatic">Automatic publishing</option></select><button class="green-button" id="saveMode">Save mode</button></div></section><section id="list"></section></main><script>
const $=id=>document.getElementById(id);let endpoint='',token='';
async function api(payload){const r=await fetch(endpoint,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,token})});const j=await r.json();if(!r.ok||!j.success)throw Error(j.message||'Request failed');return j;}
$('login').onclick=async()=>{endpoint=$('endpoint').value.trim();token=$('token').value;if(!endpoint||!token){$('status').textContent='Enter the Web App URL and Admin Token.';return;}await load();};
async function load(){try{const j=await api({action:'adminList'});$('controls').hidden=false;$('mode').value=j.mode;$('list').replaceChildren();(j.reviews||[]).forEach(v=>{const card=document.createElement('article');card.className='admin-review';const c=document.createElement('div');const title=document.createElement('strong');title.textContent=v.first_name+' — '+v.course+' ['+v.status+']';const p=document.createElement('p');p.textContent=v.review;const date=document.createElement('small');date.textContent=String(v.created_at);c.append(title,p,date);const actions=document.createElement('div');actions.className='admin-actions';[['Approve','approved','approve'],['Pending','pending','pending'],['Hide','hidden','pending'],['Delete','delete','danger']].forEach(([label,status,cls])=>{const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=async()=>{if(status==='delete'&&!confirm('Permanently delete this review?'))return;try{await api({action:'adminModerate',id:v.id,status});await load();}catch(e){$('status').textContent=e.message;}};actions.append(b);});card.append(c,actions);$('list').append(card);});$('status').textContent='Loaded '+(j.reviews||[]).length+' reviews.';}catch(e){$('status').textContent=e.message;}}
$('saveMode').onclick=async()=>{try{const j=await api({action:'adminSetMode',mode:$('mode').value});$('status').textContent='Publishing mode saved: '+j.mode;await load();}catch(e){$('status').textContent=e.message;}};
</script></body></html>
